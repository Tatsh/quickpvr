concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  actions:
    name: 'Actions'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          build-mode: 'none'
          languages: 'actions'
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:actions'
  linux:
    name: 'C/C++ (Linux)'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules libkf6coreaddons-dev \
            libkf6filemetadata-dev libkf6kio-dev ninja-build qt6-base-dev
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:c-cpp/os:linux'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: 'never'
      - name: 'Drop results in fetched dependencies'
        run: '.github/scripts/drop-build-results.sh "$RUNNER_TEMP/codeql-sarif"'
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:c-cpp/os:linux'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
  macos:
    name: 'C/C++ (macOS)'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'macos-15'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Homebrew's spdlog is arm64 only, but builds traced by CodeQL target x86_64, so the pinned
      # spdlog is built from source with the project instead.
      - name: 'Install dependencies'
        run: 'brew install ninja'
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:c-cpp/os:macos'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: 'never'
      - name: 'Drop results in fetched dependencies'
        run: '.github/scripts/drop-build-results.sh "$RUNNER_TEMP/codeql-sarif"'
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:c-cpp/os:macos'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
  windows:
    name: 'C/C++ (Windows)'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'windows-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --config Debug
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:c-cpp/os:windows'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: 'never'
      - name: 'Drop results in fetched dependencies'
        run: '.github/scripts/drop-build-results.sh "$RUNNER_TEMP/codeql-sarif"'
        shell: 'bash'
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934'
        with:
          category: '/language:c-cpp/os:windows'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/*.mm'
      - '**/CMakeLists.txt'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '**/action.yml'
      - '**/action.yaml'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/*.mm'
      - '**/CMakeLists.txt'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '**/action.yml'
      - '**/action.yaml'
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
