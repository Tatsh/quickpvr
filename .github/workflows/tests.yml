concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  linux:
    name: 'Linux'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules libkf6coreaddons-dev libkf6kio-dev \
            ninja-build qt6-base-dev
      - name: 'Configure'
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: 'Build'
        run: 'cmake --build build'
      - env:
          QT_QPA_PLATFORM: 'offscreen'
        name: 'Test'
        run: 'ctest --test-dir build --output-on-failure'
      # Qt and KIO only load plugins from Qt's plugin directory, such as /usr/lib64/qt6/plugins.
      - name: 'Verify installed plugins'
        run: |
          DESTDIR="$PWD/staging" cmake --install build --prefix /usr
          qtpaths=$(command -v qtpaths6 || echo /usr/lib/qt6/bin/qtpaths6)
          plugins="staging$("$qtpaths" --query QT_INSTALL_PLUGINS)"
          test -f "$plugins/imageformats/libqpvr.so"
          test -f "$plugins/kf6/thumbcreator/pvrthumbnail.so"
  macos:
    name: 'macOS'
    runs-on: 'macos-15'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install dependencies'
        run: 'brew install ninja spdlog'
      - name: 'Configure'
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
      - name: 'Build'
        run: 'cmake --build build'
      - name: 'Test'
        run: 'ctest --test-dir build --output-on-failure'
  windows:
    name: 'Windows'
    runs-on: 'windows-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Configure'
        run: 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug'
      - name: 'Build'
        run: 'cmake --build build --config Debug'
      - name: 'Test'
        run: 'ctest --test-dir build --build-config Debug --output-on-failure'
name: 'Tests'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
permissions:
  contents: 'read'
